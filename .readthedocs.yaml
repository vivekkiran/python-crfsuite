# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# CRFsuite and liblbfgs are git submodules; they are needed to build the
# extension, which autodoc imports.
submodules:
  include: all

python:
  install:
    - requirements: requirements-doc.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py

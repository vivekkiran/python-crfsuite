[project]
name = "python-crfsuite"
version = "0.9.12"
description = "Python binding for CRFsuite"
authors = [
  {name = "Terry Peng", email = "pengtaoo@gmail.com"},
  {name = "Mikhail Korobov", email = "kmike84@gmail.com"},
]
readme = "README.rst"
# python-crfsuite and the bundled liblbfgs are MIT; the bundled CRFsuite is
# BSD-3-Clause. Their license texts ship in the sdist and the wheels.
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE.txt", "crfsuite/COPYING", "liblbfgs/COPYING"]
requires-python = ">=3.10"
classifiers = [
   "Development Status :: 4 - Beta",
   "Intended Audience :: Developers",
   "Intended Audience :: Science/Research",
   "Programming Language :: Cython",
   "Programming Language :: Python",
   "Programming Language :: Python :: 3",
   "Programming Language :: Python :: 3.10",
   "Programming Language :: Python :: 3.11",
   "Programming Language :: Python :: 3.12",
   "Programming Language :: Python :: 3.13",
   "Programming Language :: Python :: 3.14",
   "Topic :: Software Development",
   "Topic :: Software Development :: Libraries :: Python Modules",
   "Topic :: Scientific/Engineering",
   "Topic :: Scientific/Engineering :: Information Analysis",
   "Topic :: Text Processing :: Linguistic",
]  

[project.urls]
Homepage = "https://github.com/scrapinghub/python-crfsuite"
Source = "https://github.com/scrapinghub/python-crfsuite"
Issues = "https://github.com/scrapinghub/python-crfsuite/issues"
Changelog = "https://github.com/scrapinghub/python-crfsuite/blob/master/CHANGES.rst"
Documentation = "https://python-crfsuite.readthedocs.io/"

[project.optional-dependencies]
dev = ["tox",
       "black",
       "isort",
       "flake8",
]

[build-system]
requires = ["setuptools>=77", "wheel", "cython"]
build-backend = "setuptools.build_meta"


[tool.bumpversion]
current_version = "0.9.12"
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGES.rst"
search = "\\(unreleased\\)$"
replace = "({now:%Y-%m-%d})"
regex = true


[tool.setuptools.packages.find]
include = ["pycrfsuite"]


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = [
  "tests",
  ]

[tool.isort]
profile = "black"
src_paths = ["pycrfsuite", "tests"]
